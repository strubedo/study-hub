<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCNA Prep</title>
  <meta name="description" content="Local study workspace for the Cisco CCNA 200-301 v2.0 exam.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f9cf9'/%3E%3Cpath d='M8 16h16M16 8v16M10.5 10.5l11 11M21.5 10.5l-11 11' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      const s = JSON.parse(localStorage.getItem('ccna:settings') || '{}');
      if (s.theme === 'light') document.documentElement.dataset.theme = 'light';
    } catch { /* storage blocked: default dark theme */ }
  </script>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/sim.css">
  <script src="assets/vendor/marked.min.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12h16M12 4v16M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
        </span>
        <span>
          <span class="brand-name">CCNA Prep</span><br>
          <span class="brand-sub">200-301 · blueprint v2.0</span>
        </span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="crumbs" id="crumbs"></div>
        <div class="spacer"></div>
        <button class="search-btn" id="search-btn" aria-label="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="label">Search lessons, questions…</span><kbd>Ctrl K</kbd>
        </button>
        <button class="icon-btn" id="theme-btn" aria-label="Toggle theme"></button>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
