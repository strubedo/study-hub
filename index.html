<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Hub</title>
  <meta name="description" content="Local study workspace: one site per certification course.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f9cf9'/%3E%3Cpath d='M9 9h6v6H9zM17 9h6v6h-6zM9 17h6v6H9zM17 17h6v6h-6z' fill='white'/%3E%3C/svg%3E">
  <script src="assets/theme-init.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="hub/hub.css">
</head>
<body>
  <header class="hub-top">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
      </span>
      <span>
        <span class="brand-name">Study Hub</span><br>
        <span class="brand-sub">Certification courses</span>
      </span>
    </a>
    <div class="spacer"></div>
    <button class="icon-btn" id="theme-btn" aria-label="Toggle theme"></button>
  </header>
  <main class="hub">
    <section class="hub-hero">
      <div class="eyebrow">All courses</div>
      <h1>Pick up where you left off</h1>
      <p>Each course is its own site with its own progress. Everything stays in this browser. <span id="summary"></span></p>
    </section>
    <div class="hub-grid" id="courses"><div class="empty">Loading courses…</div></div>
    <p class="hub-foot">Progress is per course and per browser. Back it up from each course's Settings page.</p>
  </main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="hub/hub.js"></script>
</body>
</html>
